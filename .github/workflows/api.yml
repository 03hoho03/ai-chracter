name: api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      # 아래 둘은 런타임 코드도, 이 워크플로의 검사·테스트도 읽지 않는 파일이라 그것만 바뀐 커밋에는
      # CI 를 돌리지 않는다. 대상은 앱 최상위 md(`CLAUDE.md`·`README.md`)와 `probe-runs/` 아래 기록
      # 전부(html·json·md, 기록을 읽기용 HTML 로 굳히는 일회성 도구 .py 포함)다. 거기 .py 가 섞여 있어도 ruff·mypy 는
      # `src migrations scripts tests`, pytest 는 `tests`, 커버리지는 `api` 패키지만 보므로 검사 경로 밖이다.
      # `README.md` 는 `pyproject.toml` 의 `readme` 라 `uv sync` 가 설치 때 읽기는 하지만, 내용만 바뀐
      # README 는 패키지 설명 메타데이터 말고는 검사 결과를 바꾸지 않는다. README 를 지우거나 이름을
      # 바꾸는 변경은 설치를 깰 수 있는데 이 필터 때문에 CI 가 안 돌 수 있으니(이 워크플로는 손으로
      # 돌릴 수 없다), 같은 PR 에 `apps/api` 의 다른 변경(예: `src` 한 줄)을 섞어 검사가 돌게 한다.
      # `*` 는 `/` 를 넘지 않아 `apps/api` 바로 아래 md 만 빠진다 — 하위 디렉터리 md 는 앞으로 코드가
      # 읽을 수 있어 일부러 거르지 않는다. 부정 패턴은 뒤에 오는 패턴이 이기므로, 아래 양성 패턴들이
      # 이 파일들을 다시 포함하지 않는지 순서를 지킨다.
      - "!apps/api/*.md"
      - "!apps/api/probe-runs/**"
      # 자기 자신이 필터에 있는 이유: 이 워크플로의 검사 단계를 고친 커밋은 그 검사를
      # 한 번도 안 거친 채 병합된다(`deploy-api.yml` 이 같은 이유로 자기 파일을 넣어 뒀다).
      - ".github/workflows/api.yml"
      # 튜토리얼 시드 테스트가 빌더가 고를 수 있는 값(스탯 아이콘·색·턴 하한)을 이 FE 소스에서 직접 읽는다.
      - "apps/web/src/entities/chat-room/model/statIcons.ts"
      - "packages/ui/src/lib/color-palette.ts"
      - "apps/web/src/features/build-story/model/schema.ts"
  pull_request:
    paths:
      - "apps/api/**"
      # 제외 이유는 push 쪽 주석과 같다.
      - "!apps/api/*.md"
      - "!apps/api/probe-runs/**"
      - ".github/workflows/api.yml"
      # 튜토리얼 시드 테스트가 빌더가 고를 수 있는 값(스탯 아이콘·색·턴 하한)을 이 FE 소스에서 직접 읽는다.
      - "apps/web/src/entities/chat-room/model/statIcons.ts"
      - "packages/ui/src/lib/color-palette.ts"
      - "apps/web/src/features/build-story/model/schema.ts"

# PR 은 같은 브랜치의 새 push 가 옛 실행을 취소한다. main push 는 실행마다 고유 그룹(run_id)이라
# 취소도 대체도 없다 — main 끼리 한 그룹을 쓰면 `cancel-in-progress: false` 여도 그룹당 대기 실행이
# 하나만 남아, 연속 병합 때 중간 커밋의 main 검사가 사라진다. main push 검사는 쌓인 PR 을 연달아
# 병합했을 때의 사후 경보라 하나도 잃지 않게 둔다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # 버전은 dev/prod(docker-compose.dev.yml·docker-compose.prod.yml)와 맞춘다 — 실제로 도는
    # 버전과 다른 버전으로 검증해 봐야 의미가 없다. S3 는 서비스가 없다 — tests/conftest.py 가
    # 인프로세스 ThreadedMotoServer 를 랜덤 포트로 띄운다.
    services:
      postgres:
        # 벡터 칸(pgvector)을 쓰는 스키마가 돌려면 확장이 깔린 서버여야 해서 postgres:18-alpine 위에
        # pgvector 를 얹은 이미지(infra/postgres/Dockerfile)를 쓴다. alpine 위에서 컴파일했으므로 정렬
        # 규칙(musl)이 운영의 postgres:18-alpine 과 같다. 태그는 다시 밀릴 수 있어 매니페스트 digest 로
        # 고정한다 — api.yml·docker-compose.dev.yml·docker-compose.worktree.yml 이 같은 digest 를 쓴다.
        image: ghcr.io/03hoho03/postgres-pgvector@sha256:fe16e6e8926fa50cdc2d90e8a101e40d3b92efa555e310024dcec7f8a0913bc1
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # conftest.py 가 이 값을 읽어 (api.core.config import 전에) DATABASE_URL/REDIS_URL 로
      # 덮어쓴다. DB 이름이 `_test` 로 안 끝나면 conftest 가 RuntimeError 로 거부한다 — 없으면
      # conftest 가 알아서 만든다.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_character_chat_ci_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.15"

      - run: uv sync --locked

      - run: uv run ruff check src migrations scripts tests

      # mypy 증분 캐시를 run 사이에 이어 쓴다. 캐시가 있어도 mypy 는 내용이 바뀐 파일과 그 파일에
      # 기대는 모듈을 다시 검사하므로 판정은 캐시 없이 돌린 것과 같다. 의존성 버전(uv.lock)이나
      # 설정(pyproject.toml)이 바뀌면 키가 바뀐다 — 마지막 줄 restore-keys 로 옛 캐시를 받더라도
      # mypy 가 바뀐 라이브러리 파일과 설정을 알아보고 해당 모듈을 다시 검사한다.
      # `actions/cache` 는 잡의 working-directory 를 따르지 않아 경로를 저장소 루트 기준으로 적는다.
      - uses: actions/cache@v4
        with:
          path: apps/api/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock', 'apps/api/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock', 'apps/api/pyproject.toml') }}-
            mypy-${{ runner.os }}-

      - run: uv run mypy src migrations scripts tests

      # `openapi.json` 은 커밋되는 생성물이다. 스키마를 고치고 재생성을
      # 빠뜨리면 소스와 생성물이 어긋난 채로 병합된다 — 실제로 세 번 그랬고(이미지 생성 작업에서
      # 두 번, 가드 작업에서 한 번) 세 번 다 사람이 나중에 우연히 발견했다. 다시 만들어 보고
      # 커밋본과 다르면 여기서 떨어뜨린다.
      #
      # 러너에 `.env` 가 없어도 같은 바이트가 나온다 — `include_router` 가 전부 무조건이고
      # (`main.py:78-104`) 어떤 `schemas.py` 도 `settings.` 를 읽지 않아 스펙이 환경에
      # 의존하지 않는다(2026-09-13 실측). 그래서 거짓 드리프트로 빨개질 일이 없다.
      #
      # 체인의 나머지 절반(`generated.ts`)은 `lint.yml` 이 검사한다 — openapi-typescript 가
      # node 워크플로에만 깔려 있어서다.
      - name: openapi.json 드리프트 검사
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- openapi.json || {
            echo "::error::openapi.json 이 소스와 어긋났다 — apps/api 에서 'uv run python scripts/export_openapi.py' 를 돌리고 커밋해라"
            exit 1
          }

      # alembic 이 쓰는 URL 의 단일 소스는 api.core.config.settings.database_url(= DATABASE_URL
      # env) 이지 TEST_DATABASE_URL 이 아니다 — alembic.ini 의 값은 플레이스홀더고
      # migrations/env.py 가 덮어쓴다. pytest 가 쓰는 DB 와는 일부러 다른 이름을 쓴다 — pytest
      # 는 세션 종료 시 `alembic downgrade base`로 자기 DB 의 테이블을 전부 지운다.
      # psql 대신 asyncpg(이미 `uv sync`로 설치됨)를 쓴다 — 러너에 postgresql-client 가
      # 있다고 가정하지 않는다.
      - name: Create alembic-check database
        run: |
          uv run python -c "
          import asyncio
          import asyncpg

          async def main() -> None:
              conn = await asyncpg.connect(host='localhost', port=5432, user='postgres', password='postgres', database='postgres')
              await conn.execute('CREATE DATABASE ai_character_chat_ci_migrate')
              await conn.close()

          asyncio.run(main())
          "

      - name: alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_character_chat_ci_migrate
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # `-n auto` 는 러너 코어 수만큼 워커를 띄운다(GitHub 기본 러너는 public 저장소 4코어·private 2코어).
      # 워커마다 테스트 DB·Redis 번호가 따로다 — conftest.py 가 워커 id 로 갈라 준다. `--durations` 는
      # 느린 테스트가 스위트 시간을 끌어올릴 때 이 로그만 보고 찾게 하려고 둔다.
      - run: uv run pytest -n auto --durations=15 --cov --cov-report=term-missing:skip-covered --cov-fail-under=95

      # PR 에서만 빌드한다 — main push 의 빌드는 `deploy-api.yml` 이 같은 Dockerfile 로
      # 수행하고 푸시까지 하므로 여기서 또 하면 같은 이미지를 두 번 만드는 셈이다(배포
      # 트리거는 `apps/api/**` 중 런타임이 읽지 않는 테스트·문서·기록·평가 도구를 거르므로,
      # 그런 파일만 바뀐 병합은 배포 쪽 빌드도 없다). 아끼는 건 이 스텝의 실측 13초다(deploy-api 쪽
      # "빌드+푸시 2회"가 36초인데 그건 그대로 남는다). 캐시는 두 워크플로 모두 없다 —
      # 러너가 매번 새 VM 이라 레이어 캐시가 비어 있고, buildx/`cache-from` 도 쓰지 않는다.
      # PR 에서는 배포가 돌지 않으니 "빌드가 깨지지 않는지"를 여기서 확인하는 게 맞다.
      - if: github.event_name == 'pull_request'
        run: docker build -t ai-character-chat-api:ci .
