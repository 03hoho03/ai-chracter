name: api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
  pull_request:
    paths:
      - "apps/api/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.15"

      - run: uv sync --locked

      - run: uv run mypy src migrations

      - run: docker build -t ai-character-chat-api:ci .
