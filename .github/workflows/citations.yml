name: citations

# 주석·추적 문서가 저장소 밖 문서(gitignore 된 작업 문서)나 결정 번호에 기대지 않게 막는다.
# 저장소 전체를 매번 본다 — 기존 인용은 다 치웠으므로 한 줄이라도 새로 생기면 바로 드러난다.
# 어느 파일에서든 인용이 생길 수 있어서 경로 필터를 두지 않는다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 검사기 자체 시험
        run: python3 .github/scripts/check_citations_test.py

      - name: 저장소 전체 인용 검사
        run: python3 .github/scripts/check_citations.py --all
