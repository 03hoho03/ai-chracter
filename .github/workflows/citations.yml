name: citations

# 코드 주석이 저장소 밖 문서(gitignore 된 작업 문서)나 결정 번호에 기대지 않게 막는다.
# 이번 변경에서 **추가된 줄만** 본다 — 기존 인용은 정리 PR 들이 치우고, 다 치운 뒤 전체 스캔으로 바꾼다.
# 어느 파일에서든 새 줄이 생길 수 있어서 경로 필터를 두지 않는다.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      # base...head 비교에 merge-base 가 필요해서 전체 이력을 받는다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 검사기 자체 시험
        run: python3 .github/scripts/check_citations_test.py

      - name: 추가된 줄의 인용 검사
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 새 브랜치 첫 push 는 before 가 0 으로 채워지고, 강제 push 로 사라진 커밋은 받아 올 수 없다.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "비교할 base 가 없어 건너뛴다 (BASE='$BASE')"
            exit 0
          fi
          python3 .github/scripts/check_citations.py --base "$BASE"
