name: lint

# eslint는 루트에서 **한 번만** 돈다 — 패키지별로 돌리면 `no-relative-import-paths`의 `rootDir`가
# cwd 기준이라 상대 경로 import 금지 검사가 통째로 빠진다(합계 210 vs 루트 368으로 실측). 그래서 web/admin
# 워크플로에 끼워 넣지 않고 별도 워크플로로 뒀다 — 저장소 전체가 대상이라 앱별로 나눌 이유도 없다.
#
# `eslint.config.mjs`가 경로 필터에 있는 이유: 규칙만 바뀐 커밋도 검사돼야 한다. web/admin
# 워크플로의 필터에는 그 파일이 없어서, 여기에 없으면 규칙 변경이 아무 검사도 안 받는다.
#
# `apps/api/openapi.json`이 경로 필터에 있는 이유도 같다 — 아래 `generated.ts` 드리프트
# 검사는 **BE 스펙만 바뀐 PR에서도** 돌아야 한다. 빼면 조용히 스킵된다.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      # 앱 최상위 문서·brand(손으로 돌리는 로고 도구)·perf(측정 기록)는 빌드·테스트·lint 가 읽지 않는다.
      # 하위 디렉터리 md 는 거르지 않는다 — 코드가 `?raw` 로 읽는 원고가 있다(`*` 는 `/` 를 넘지 않는다).
      - "!apps/web/*.md"
      - "!apps/web/brand/**"
      - "!apps/web/perf/**"
      - "apps/admin/**"
      # 앱 최상위 문서는 빌드·lint 가 읽지 않는다.
      - "!apps/admin/*.md"
      - "apps/chat-lab/**"
      # 앱 최상위 문서는 lint 가 읽지 않는다.
      - "!apps/chat-lab/*.md"
      - "packages/**"
      # 패키지 최상위 문서는 어느 빌드·테스트·lint 도 읽지 않는다.
      - "!packages/*/*.md"
      - "apps/api/openapi.json"
      - ".github/workflows/lint.yml"
      - "eslint.config.mjs"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      # `pnpm run lint` 의 정의가 루트 `package.json` 에 있다. turbo 를 쓰지 않으므로 `turbo.json` 은 넣지 않는다.
      - "package.json"
  pull_request:
    paths:
      - "apps/web/**"
      # 앱 최상위 문서·brand(손으로 돌리는 로고 도구)·perf(측정 기록)는 빌드·테스트·lint 가 읽지 않는다.
      # 하위 디렉터리 md 는 거르지 않는다 — 코드가 `?raw` 로 읽는 원고가 있다(`*` 는 `/` 를 넘지 않는다).
      - "!apps/web/*.md"
      - "!apps/web/brand/**"
      - "!apps/web/perf/**"
      - "apps/admin/**"
      # 앱 최상위 문서는 빌드·lint 가 읽지 않는다.
      - "!apps/admin/*.md"
      - "apps/chat-lab/**"
      # 앱 최상위 문서는 lint 가 읽지 않는다.
      - "!apps/chat-lab/*.md"
      - "packages/**"
      # 패키지 최상위 문서는 어느 빌드·테스트·lint 도 읽지 않는다.
      - "!packages/*/*.md"
      - "apps/api/openapi.json"
      - ".github/workflows/lint.yml"
      - "eslint.config.mjs"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      # `pnpm run lint` 의 정의가 루트 `package.json` 에 있다. turbo 를 쓰지 않으므로 `turbo.json` 은 넣지 않는다.
      - "package.json"

# PR 은 새 커밋이 오면 옛 검사를 취소한다. main push 는 run 마다 고유 그룹이라 서로 취소·대기하지 않는다 —
# 같은 그룹이면 그룹당 대기 1개 규칙 때문에 연속 병합 시 중간 커밋의 검사가 대기 중에 버려진다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # `generated.ts` 도 커밋되는 생성물이다(`openapi.json` → 이 파일).
      # 체인의 앞쪽 절반은 `api.yml` 이 검사하고, 뒤쪽인 이 파일을 여기서 검사하는 이유는
      # openapi-typescript 가 node 워크플로에만 깔려 있어서다.
      #
      # `pnpm typecheck` 가 이것을 대신하지 못한다. 필드가 **추가**될 때는 FE 가 그 필드를
      # 쓰는 순간 타입 에러로 잡히지만, 필드가 **삭제·변경**될 때는 옛 타입이 그대로 남아
      # typecheck 는 초록인 채 런타임에 undefined 가 된다. 잡히는 방향이 절반뿐이다.
      - name: generated.ts 드리프트 검사
        run: |
          pnpm --filter @ai-character-chat/api-types run codegen
          git diff --exit-code -- packages/api-types/src/generated.ts || {
            echo "::error::generated.ts 가 openapi.json 과 어긋났다 — 'pnpm --filter @ai-character-chat/api-types run codegen' 을 돌리고 커밋해라"
            exit 1
          }
