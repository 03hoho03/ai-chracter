# BE 자동배포 — main push → 이미지 빌드/푸시 → GCE VM에서 교체.
#
# Cloud Run 시절의 Cloud Build 트리거(`apps/api/cloudbuild.yaml`)를 대체한다. 그 트리거는
# 비활성화해 뒀고 삭제하지는 않았다.
#
# **비밀값이 없다.** Workload Identity Federation 으로 GitHub 이 발급한 OIDC 토큰을 GCP 가 직접
# 검증하므로 서비스계정 키를 GitHub 에 저장하지 않는다(애초에 조직 정책
# `iam.disableServiceAccountKeyCreation` 이 키 발급 자체를 막는다). 아래 두 값은 비밀이 아니라
# 식별자라 그대로 커밋한다. 저장소가 public 이어도 무방하다 — 신뢰 경계는 GCP 쪽
# `attribute-condition`(`assertion.repository == '03hoho03/ai-chracter'`)이 잡는다.
#
# VM 쪽 교체는 `ops/swap-api.sh` 하나가 한다(api 를 blue/green 두 색으로 두고 쉬는 색에 새 이미지를
# 띄운 뒤 옛 색을 드레인하고 내린다). 수동 롤백·env 반영 재기동도 같은 스크립트를 부르므로, 이
# 워크플로는 그 스크립트를 부르는 자리와 앞뒤 확인만 갖는다.

name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      # VM 은 compose·Caddyfile 을 git 에서 받아가므로 이 둘도 배포 트리거다.
      - "docker-compose.prod.yml"
      - "Caddyfile"
      # 저장소 루트 ops/(예: ops/logrotate.d)도 VM이 /opt/ddona/app의 git reset --hard로만
      # 받아간다 — 트리거가 없으면 ops/ 단독 변경은 배포되지 않고 다음 무관한 api 배포 때
      # 조용히 따라 들어간다(DEPLOY.md).
      - "ops/**"
      - ".github/workflows/deploy-api.yml"
  # 롤백·재배포용 수동 실행. compose·Caddyfile·ops 스크립트는 어느 경우든 main 최신을 받아가고(아래
  # git reset), 이미지만 고른 태그가 된다.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 이미지 태그(커밋 SHA 앞 7자리). 비우면 이 커밋을 빌드해 배포한다. 채우면 빌드 없이 레지스트리에 있는 그 태그로 롤백·재배포한다."
        type: string
        required: false
        default: ""
      skip_overlap:
        description: "겹침 없이 교체한다(위험한 마이그레이션용 탈출구). 새 색을 옆에 띄우지 않고 서빙 중인 색을 그 자리에서 재생성해 짧은 끊김이 생긴다."
        type: boolean
        required: false
        default: false

# `pull_request` 를 트리거에 넣지 않는다 — 저장소가 public 이라 포크 PR 이 배포 권한을 얻으면 안 된다.
concurrency:
  group: deploy-api
  cancel-in-progress: false # 배포 도중 취소하면 VM 이 어중간한 상태로 남는다

env:
  PROJECT_ID: ddona-ai-character-chat
  REGION: asia-northeast3
  ZONE: asia-northeast3-a
  INSTANCE: ddona-api
  IMAGE: asia-northeast3-docker.pkg.dev/ddona-ai-character-chat/ddona/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 토큰 발급에 필요하다. 없으면 WIF 인증이 실패한다.
    steps:
      - name: 배포 입력 확정
        id: params
        # 입력값은 `run:` 본문에 `${{ }}` 로 직접 끼우지 않고 env 로만 받는다 — 본문에 끼우면 입력 문자열이
        # 그대로 셸 코드가 된다. 여기서 형식을 좁힌 값만 다음 step 으로 넘기는데, 이 값은 결국 VM 에서 root
        # 로 도는 명령줄(`--command`)에 들어가므로 이 검증이 그 자리의 인젝션 방지다.
        #
        # push 실행에는 inputs 가 없어(null) 빈 태그·false 로 읽힌다 — 이 커밋을 빌드하는 평상시 경로다.
        # 태그는 SHA 앞 7자리만 받는다. 빌드 step 이 그 형태로만 푸시하므로 다른 형태는 레지스트리에 없다.
        # 빌드 여부는 이 step 의 출력으로 정한다 — 뒤 step 의 `if:` 가 null 과 빈 문자열 비교 규칙에
        # 기대지 않게 하려는 것이다.
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          SKIP_OVERLAP_INPUT: ${{ inputs.skip_overlap && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            TAG="$IMAGE_TAG_INPUT"
            BUILD=false
          else
            TAG="${GITHUB_SHA::7}"
            BUILD=true
          fi
          if ! [[ "$TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "::error::image_tag 는 커밋 SHA 앞 7자리(소문자 16진수)여야 한다: '$TAG'"
            exit 1
          fi
          case "$SKIP_OVERLAP_INPUT" in
            true | false) ;;
            *)
              echo "::error::skip_overlap 값이 true/false 가 아니다: '$SKIP_OVERLAP_INPUT'"
              exit 1
              ;;
          esac
          echo "배포 입력: tag=$TAG build=$BUILD skip_overlap=$SKIP_OVERLAP_INPUT"
          {
            echo "tag=$TAG"
            echo "build=$BUILD"
            echo "skip_overlap=$SKIP_OVERLAP_INPUT"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/377499972563/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: ddona-deployer@ddona-ai-character-chat.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Artifact Registry 인증
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: 이미지 빌드 · 푸시
        if: steps.params.outputs.build == 'true'
        working-directory: apps/api
        # 러너가 amd64 라 VM 과 아키텍처가 같다 — 크로스 빌드가 필요 없다(맥에서 손으로 밀 때만 필요).
        # SHA 태그가 롤백 단위이고, latest 는 사람이 최신을 찾을 때만 쓴다.
        env:
          TAG: ${{ steps.params.outputs.tag }}
        run: |
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: 지정 태그가 레지스트리에 있는지 확인
        if: steps.params.outputs.build == 'false'
        # VM 의 교체 스크립트도 아무것도 바꾸기 전에 pull 부터 해 없는 태그면 멈추지만, 오타 난 태그로
        # VM 에 들어가기 전에 여기서 끊는 편이 원인이 바로 보인다.
        env:
          TAG: ${{ steps.params.outputs.tag }}
        run: |
          if ! docker manifest inspect "$IMAGE:$TAG" > /dev/null; then
            echo "::error::레지스트리에 $IMAGE:$TAG 가 없다 — 태그(커밋 SHA 앞 7자리)를 확인한다"
            exit 1
          fi
          echo "레지스트리 확인: $IMAGE:$TAG"

      - name: VM 에 배포
        # IAP 터널로 들어간다 — VM 의 22번은 인터넷에 열려 있지 않다(IAP 대역만 허용).
        #
        # **전부 sudo 로 돈다.** OS Login 은 접속 주체마다 별도 POSIX 사용자를 만들기 때문에,
        # `/opt/ddona` 를 특정 사람 계정 소유로 두면 배포 서비스계정이 git("dubious ownership")·
        # docker·`.env`(0600) 어느 것에도 손대지 못한다. 그래서 운영 상태는 root 소유로 두고
        # 배포는 sudo 로 한다 — 어차피 배포 주체는 실행 중인 이미지를 갈아끼울 수 있으므로
        # 여기서 root 를 주는 것이 권한을 실질적으로 넓히지는 않는다. 교체 스크립트의 상태 파일·잠금
        # 파일도 root 소유 `/var/lib/ddona/` 에 있다.
        #
        # 원격 스크립트는 따옴표 heredoc(`<<'REMOTE'`)이라 러너 쪽 변수가 그 안에서 펼쳐지지 않는다.
        # 원격 셸에 들어가는 값은 `--command` 의 `sudo VAR=…` 에 적은 것뿐이다 — 여기서 빠뜨리면 원격에서는
        # 조용히 빈 값이 된다. 특히 SKIP_OVERLAP 이 빠지면 탈출구를 켠 배포도 평상시 겹침 교체로 돌고 아무
        # 에러도 나지 않는다. 그래서 둘 다 넘기고, 교체 스크립트가 시작 줄에 받은 값을 찍는다. 두 값은
        # '배포 입력 확정' step 이 형식을 검증했다(작은따옴표 안에 들어가도 안전한 글자만 남는다).
        #
        # 원격 출력은 파일로도 받아 마지막 줄의 완료 표식을 확인한다. 원격 스크립트가 stdin 에서 읽히는
        # 탓에, 중간 명령 하나가 stdin 을 삼키면 bash 는 남은 줄을 못 읽고 정상 종료해 이 step 이 성공으로
        # 끝난다(실제로 두 번 있었다 — 원격 스크립트의 `< /dev/null` 주석). 표식이 없으면 그런 경우다.
        env:
          TAG: ${{ steps.params.outputs.tag }}
          SKIP_OVERLAP: ${{ steps.params.outputs.skip_overlap }}
        run: |
          set -euo pipefail
          REMOTE_LOG="$RUNNER_TEMP/remote-deploy.log"
          gcloud compute ssh "$INSTANCE" --zone="$ZONE" --tunnel-through-iap --quiet \
            --command="sudo TAG='$TAG' SKIP_OVERLAP='$SKIP_OVERLAP' bash -s" <<'REMOTE' | tee "$REMOTE_LOG"
          set -euo pipefail
          echo "원격 입력: tag=$TAG skip_overlap=${SKIP_OVERLAP:-}"
          cd /opt/ddona/app
          # compose·Caddyfile 변경을 받아온다. 로컬 수정본은 버린다 — 형상은 git 이 단일 소스다.
          git fetch --depth=1 origin main
          git reset --hard origin/main
          # 이 스크립트 안에서 compose·docker·교체 스크립트를 부를 때는 `< /dev/null` 을 붙인다. 이 스크립트는 `bash -s` 로
          # stdin 에서 읽히는데, stdin 을 읽는 명령이 하나라도 있으면 남은 줄까지 삼켜 bash 가 읽을 게 없어
          # 조용히 정상 종료한다 — `compose run`·`compose exec` 는 -T 를 줘도 stdin 을 컨테이너에 붙인다.
          # 실제로 마이그레이션 줄(`compose run --rm -T api alembic …`)을 처음 넣었을 때 마이그레이션만 돌고
          # 컨테이너는 안 갈린 채 배포가 "성공"으로 보고됐고(/health 는 옛 컨테이너도 200 을 주므로 검증도
          # 통과했다), 그 뒤에는 아래 caddy reload 가 같은 식으로 나머지를 삼켜 ps·실행 이미지 확인·이미지
          # 정리가 어느 배포에서도 돌지 않은 채 step 이 성공으로 끝났다. 교체 스크립트도 내부의 모든 compose
          # 호출에 같은 처리를 하고, 이 스크립트 마지막 줄의 완료 표식을 러너가 확인한다.
          #
          # .env 를 고치거나 compose 가 읽기 전에 형식부터 본다. 이 파일은 compose(앱 컨테이너·보간),
          # docker run --env-file, 크론의 grep|cut 이 각자 읽어서, 따옴표·$·줄바꿈으로 잘린 조각 같은 표기가
          # 하나라도 있으면 앱과 크론이 서로 다른 값을 보면서 아무도 실패하지 않는다. 위반이면 배포를 멈춘다.
          # 키 이름 검사는 하지 않는다 — 이 파일에는 앱이 읽지 않는 compose·크론·Bugsink 키도 있다.
          # 출력은 줄 번호·규칙 이름뿐이다(값도 키 이름도 찍지 않는다).
          if ! /usr/bin/python3 ops/check_env.py --format /opt/ddona/.env < /dev/null; then
            echo "::error::/opt/ddona/.env 형식 위반 — 위 줄을 VM 에서 고친 뒤 재실행한다(DEPLOY.md 의 'env 파일 형식' 절)"
            exit 1
          fi
          C="docker compose -f docker-compose.prod.yml --env-file /opt/ddona/.env"
          # 이미지 pull·.env 의 이미지 줄 교체·마이그레이션·기동·드레인·상태 파일은 전부 교체 스크립트 안에서
          # 그 순서로 돈다. 마이그레이션이 새 컨테이너 기동보다 먼저인 것은 그대로다 — main.py 의 lifespan 훅이
          # 기동마다 users.suspended_at 을 SELECT 하는데(rebuild_suspended_user_markers), 마이그레이션 전에 새
          # 이미지가 뜨면 UndefinedColumnError 로 죽는다.
          #
          # 어느 경로로 갈지는 compose 가 아니라 docker 라벨로 본다 — blue/green 이행 전에는 .env 에 색별 이미지
          # 키가 없어 compose 가 `ps` 까지 거부한다. 위에서부터 처음 맞는 것 하나:
          # 1. 옛 단일 api 컨테이너가 있다(정지 포함, 색 컨테이너가 같이 있어도) → blue/green 이행 스크립트를
          #    부르고, 같은 배포 안에서 같은 태그로 평상시 교체를 한 번 이어서 돈다(이행 직후 평상시 경로가
          #    운영에서 실제로 도는지 바로 본다). 이행이 중간에 실패하면 blue 가 남아 "색 ≥1"이 되는데, 그걸
          #    평상시 교체로 보내면 Caddy 가 아직 옛 설정이라 매번 실패하고 옛 api 는 영영 안 지워진다 — 그래서
          #    옛 api 가 남아 있는 한 이행 스크립트로 보낸다. 이행 스크립트는 재실행 가능해서 된 단계는 건너뛴다.
          #    복구는 같은 태그로 이 워크플로를 다시 돌리는 것이다(image_tag 에 그 태그, 또는 실패한 실행의 재실행).
          # 2. 떠 있는 색이 하나 이상 → 평상시 교체. SKIP_OVERLAP 은 위 sudo 로 이미 환경에 들어와 있다.
          # 3. 그 밖(컨테이너가 하나도 없다 — VM 재구축 직후) → 교체할 대상이 없어 멈춘다.
          OLD_API="$(docker ps -aq --filter label=com.docker.compose.project=ddona --filter label=com.docker.compose.service=api < /dev/null)"
          BLUE_UP="$(docker ps -q --filter label=com.docker.compose.project=ddona --filter label=com.docker.compose.service=api_blue < /dev/null)"
          GREEN_UP="$(docker ps -q --filter label=com.docker.compose.project=ddona --filter label=com.docker.compose.service=api_green < /dev/null)"
          if [ -n "$OLD_API" ]; then
            echo "옛 단일 api 컨테이너가 있다 — blue/green 이행 뒤 같은 태그로 평상시 교체"
            bash ops/bootstrap-bluegreen.sh "$TAG" < /dev/null
            bash ops/swap-api.sh "$TAG" < /dev/null
          elif [ -n "$BLUE_UP$GREEN_UP" ]; then
            bash ops/swap-api.sh "$TAG" < /dev/null
          else
            echo "::error::떠 있는 api 컨테이너가 없다 — 교체할 대상이 없다. DEPLOY.md 의 '빈 상태에서 첫 기동' 절차로 먼저 띄운다"
            exit 1
          fi
          # caddy 의 compose 수준 변경(env·볼륨·이미지)은 여기서 반영된다. 바뀐 게 없으면 아무것도 안 한다.
          # api 색은 넣지 않는다 — 색 기동은 교체 스크립트 몫이고, 여기서 색을 부르면 쉬는 색까지 뜬다.
          $C up -d --wait caddy
          # 평상시 교체에는 아래 reload 가 필요 없다 — 두 색 업스트림이 Caddyfile 에 고정으로 적혀 있어
          # 교체마다 설정이 바뀌지 않는다. 이 루프는 Caddyfile 자체가 바뀐 배포를 위한 것이다.
          #
          # Caddyfile은 bind mount라 내용만 바뀌어서는 compose의 config-hash에 안 잡히고,
          # 위 up -d는 caddy 컨테이너를 재생성하지 않는다.
          # caddy 이미지 자체에는 --watch 같은 자동 재적용 기능이 없다.
          #
          # 그래서 reload로 명시적으로 재적용을 시도한다 — caddy가 방금 새로 뜬 경우(예:
          # volumes 목록이 바뀌어 재생성된 경우)는 이미 최신 Caddyfile로 시작했으므로 reload가
          # "설정 변경 없음"으로 조용히 no-op한다.
          # ⚠️ 계속 떠 있던 컨테이너에서는 이 reload가 새 Caddyfile을 반영한다는 보장이 없다 —
          # `Caddyfile`은 파일 단위 bind mount라, git reset --hard가 호스트 파일을 덮어쓰지 않고
          # 새 inode로 만들면 컨테이너 쪽 마운트는 옛 inode를 계속 보고, reload는 그 옛 내용을
          # "성공적으로" 재적재할 뿐이다(2026-09-15 실측 — DEPLOY.md "BE → GCE VM" 절의 "Caddyfile만 바뀐 배포는
          # caddy reload가 성공해도 컨테이너 안 내용이 안 바뀔 수 있다" 참조). 배포 뒤 반영 여부는
          # 컨테이너 안 파일로 확인하고, 안 바뀌었으면 `up -d --force-recreate --wait caddy`.
          # ⚠️ 방금 재생성된 caddy 에 곧바로 reload 를 걸면 **admin API(127.0.0.1:2019)가 아직
          # 바인딩되기 전**이라 `connection refused` 로 죽는다 — 2026-09-15 첫 배포에서 실측했다.
          # 컨테이너 로그의 `serving initial configuration`(ts …379.3877)과 reload 실패
          # (04:42:59.45 ≈ …379.45)가 **0.07초 차**였다. compose 의 healthcheck 는 :80 을 보므로
          # admin API 준비를 보장하지 않는다. 그래서 짧게 재시도한다 — `|| true` 로 삼키지
          # 않는 이유는 Caddyfile 문법 오류 같은 진짜 실패를 배포 성공으로 만들면 안 되기 때문이다.
          #
          # `< /dev/null` 이 빠져 있던 동안 이 reload 가 스크립트 나머지를 삼켰다(위 stdin 주석).
          for i in 1 2 3 4 5; do
            if $C exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile < /dev/null; then
              break
            fi
            if [ "$i" = 5 ]; then
              echo "caddy reload 가 5회 모두 실패했다" >&2
              exit 1
            fi
            echo "caddy reload 재시도 $i/5 (admin API 준비 대기)"
            sleep 2
          done
          $C ps --format 'table {{.Service}}\t{{.Status}}' < /dev/null
          # 새 이미지로 실제로 갈렸는지 확인한다. 아래 "배포 검증" 의 /health 200 만으로는
          # 위와 같은 무동작 배포를 잡을 수 없다 — 옛 컨테이너가 그대로 답하기 때문이다.
          # 서빙 중인 색은 교체 스크립트가 남긴 상태 파일과 실제 실행 색으로 정한다. 두 색이 다 떠 있으면
          # (교체가 중간에 멈춘 잔재) 이 헬퍼가 에러를 내 배포가 실패한다 — 그 형상은 사람이 봐야 한다.
          ACTIVE="$(bash ops/active-color.sh < /dev/null)"
          RUNNING="$(docker inspect --format '{{.Config.Image}}' "ddona-api_${ACTIVE}-1" < /dev/null)"
          EXPECTED="asia-northeast3-docker.pkg.dev/ddona-ai-character-chat/ddona/api:${TAG}"
          if [ "$RUNNING" != "$EXPECTED" ]; then
            echo "배포 실패: api_${ACTIVE} 의 실행 이미지가 다르다 ($RUNNING != $EXPECTED)" >&2
            exit 1
          fi
          echo "실행 이미지 확인: api_${ACTIVE} = $RUNNING"
          # 받은 이미지를 지우지 않으면 배포마다 쌓여 디스크가 찬다. 실행 이미지 확인을 통과한 뒤에만
          # 돌고, 로컬 API 이미지를 최근 3개(+ 실행 중)만 남긴다. 그보다 옛 태그로 롤백하면 교체 스크립트가
          # Artifact Registry 에서 다시 받는다(교체 스크립트는 언제나 pull 부터 한다).
          #
          # 배포는 이미 끝났으므로 정리 실패로 배포를 실패시키지 않고 경고만 남긴다. `if` 조건 자리의
          # 명령은 set -e 대상이 아니라 실패를 여기서 받는다 — 셸 함수로 감싸 `if ! fn` 으로 부르면
          # 함수 본문 전체의 errexit 가 꺼지므로, 정리 로직은 함수가 아니라 파이썬 모듈 안에 둔다.
          # stdout 으로 echo 해야 러너가 원격 출력 줄에서 ::warning:: 을 주석으로 읽는다.
          # timeout 은 도커 데몬이 멈췄을 때 배포 step 이 끝나지 않는 것을 막는다.
          if ! timeout 120 env PYTHONPATH=/opt/ddona/app/apps/api/scripts /usr/bin/python3 -m ops.prune_api_images \
               --repo asia-northeast3-docker.pkg.dev/ddona-ai-character-chat/ddona/api --keep 3 < /dev/null; then
            echo "::warning::로컬 API 이미지 정리가 실패했다 — 위 출력과 VM 디스크(df -h /)를 확인한다"
          fi
          # 이 줄이 러너 쪽 출력에 있어야 원격 스크립트가 끝까지 돈 것이다(위 stdin 주석).
          echo "DDONA_REMOTE_DEPLOY_DONE tag=$TAG"
          REMOTE
          if ! grep -Fq "DDONA_REMOTE_DEPLOY_DONE tag=$TAG" "$REMOTE_LOG"; then
            echo "::error::원격 배포 스크립트의 완료 표식이 출력에 없다 — 중간에 stdin 이 삼켜져 남은 줄이 돌지 않았을 수 있다. 위 원격 출력이 어디서 끊겼는지 본다"
            exit 1
          fi

      - name: 배포 검증
        # 컨테이너가 떴다는 것과 인터넷에서 응답한다는 것은 다른 주장이다. 밖에서 확인한다.
        # 교체 중 드레인 플래그가 세워진 옛 색은 /health 가 503 이지만, 그 색은 교체 끝에 지워져 Caddy
        # 업스트림에는 새 색 하나만 남는다 — 그래서 여기 200 은 "인터넷→TLS→Caddy→새 색"이 통한다는 뜻이다.
        # 드레인 중인 색만 남았다면 여기서 503 으로 실패한다. /health 는 DB·Redis 를 보지 않고, 이미지가 맞는지는
        # 위 원격 단계의 실행 이미지 확인이 맡는다.
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 https://api.ddona.site/health || true)
            [ "$code" = "200" ] && echo "✅ /health 200" && exit 0
            echo "  대기 ${i}/12 (HTTP ${code})"; sleep 5
          done
          echo "::error::배포 후 /health 가 200 이 아니다"; exit 1
