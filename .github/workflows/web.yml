name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      # 앱 최상위 문서·brand(손으로 돌리는 로고 도구)·perf(측정 기록)는 빌드·테스트·lint 가 읽지 않는다.
      # 하위 디렉터리 md 는 거르지 않는다 — 코드가 `?raw` 로 읽는 원고가 있다(`*` 는 `/` 를 넘지 않는다).
      - "!apps/web/*.md"
      - "!apps/web/brand/**"
      - "!apps/web/perf/**"
      - "packages/**"
      # 패키지 최상위 문서는 어느 빌드·테스트·lint 도 읽지 않는다.
      - "!packages/*/*.md"
      # 작성 가이드의 예시 인용 대조 테스트가 이 시드 파일을 읽는다 — 시드만 고친 변경에서도 돌아야 한다.
      - "apps/api/scripts/seed_content/data/tutorial/**"
      # 미디어 북 태그 규칙 테스트가 서버 테스트와 함께 이 입력 표를 읽는다 — 표만 고친 변경에서도 돌아야 한다.
      - "apps/api/tests/fixtures/media_tag_cases.json"
      # 작가 글 매크로 치환 테스트도 서버 테스트와 함께 이 입력 표를 읽는다.
      - "apps/api/tests/fixtures/author_macro_cases.json"
      # 빌더가 서버와 같은 글자·개수 한도를 이 표에서 읽는다 — 표만 고친 변경에서도 web 빌드와 테스트가 돌아야 한다.
      - "apps/api/src/api/content/builder_limits.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      # CI 정의·루트 스크립트·turbo 태스크 정의가 바뀌어도 아래 turbo 단계가 다시 돌아야 한다.
      - ".github/workflows/web.yml"
      - "package.json"
      - "turbo.json"
  pull_request:
    paths:
      - "apps/web/**"
      # 앱 최상위 문서·brand(손으로 돌리는 로고 도구)·perf(측정 기록)는 빌드·테스트·lint 가 읽지 않는다.
      # 하위 디렉터리 md 는 거르지 않는다 — 코드가 `?raw` 로 읽는 원고가 있다(`*` 는 `/` 를 넘지 않는다).
      - "!apps/web/*.md"
      - "!apps/web/brand/**"
      - "!apps/web/perf/**"
      - "packages/**"
      # 패키지 최상위 문서는 어느 빌드·테스트·lint 도 읽지 않는다.
      - "!packages/*/*.md"
      # 작성 가이드의 예시 인용 대조 테스트가 이 시드 파일을 읽는다 — 시드만 고친 변경에서도 돌아야 한다.
      - "apps/api/scripts/seed_content/data/tutorial/**"
      # 미디어 북 태그 규칙 테스트가 서버 테스트와 함께 이 입력 표를 읽는다 — 표만 고친 변경에서도 돌아야 한다.
      - "apps/api/tests/fixtures/media_tag_cases.json"
      # 작가 글 매크로 치환 테스트도 서버 테스트와 함께 이 입력 표를 읽는다.
      - "apps/api/tests/fixtures/author_macro_cases.json"
      # 빌더가 서버와 같은 글자·개수 한도를 이 표에서 읽는다 — 표만 고친 변경에서도 web 빌드와 테스트가 돌아야 한다.
      - "apps/api/src/api/content/builder_limits.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      # CI 정의·루트 스크립트·turbo 태스크 정의가 바뀌어도 아래 turbo 단계가 다시 돌아야 한다.
      - ".github/workflows/web.yml"
      - "package.json"
      - "turbo.json"

# PR 은 새 커밋이 오면 옛 검사를 취소한다. main push 는 run 마다 고유 그룹이라 서로 취소·대기하지 않는다 —
# 같은 그룹이면 그룹당 대기 1개 규칙 때문에 연속 병합 시 중간 커밋의 검사가 대기 중에 버려진다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run typecheck --filter=@ai-character-chat/web...

      - run: pnpm exec turbo run test --filter=@ai-character-chat/web...

      - run: pnpm exec turbo run build --filter=@ai-character-chat/web...
# probe
