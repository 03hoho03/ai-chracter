name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      # 작성 가이드의 예시 인용 대조 테스트가 이 시드 파일을 읽는다 — 시드만 고친 변경에서도 돌아야 한다.
      - "apps/api/scripts/seed_content/data/tutorial/**"
      # 미디어 북 태그 규칙 테스트가 서버 테스트와 함께 이 입력 표를 읽는다 — 표만 고친 변경에서도 돌아야 한다.
      - "apps/api/tests/fixtures/media_tag_cases.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      # 작성 가이드의 예시 인용 대조 테스트가 이 시드 파일을 읽는다 — 시드만 고친 변경에서도 돌아야 한다.
      - "apps/api/scripts/seed_content/data/tutorial/**"
      # 미디어 북 태그 규칙 테스트가 서버 테스트와 함께 이 입력 표를 읽는다 — 표만 고친 변경에서도 돌아야 한다.
      - "apps/api/tests/fixtures/media_tag_cases.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec turbo run typecheck --filter=@ai-character-chat/web...

      - run: pnpm exec turbo run test --filter=@ai-character-chat/web...

      - run: pnpm exec turbo run build --filter=@ai-character-chat/web...
