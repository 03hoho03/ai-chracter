[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "03hoho03", email = "122659293+03hoho03@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "boto3>=1.40.0",
    "email-validator>=2.3.0",
    "fastapi>=0.139.0",
    "google-genai>=2.10.0",
    "httpx>=0.27.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.50.2",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "boto3-stubs[s3]>=1.40.0",
    "moto[server]>=5.1.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff",
    "types-PyYAML>=6.0.0",
]

[tool.ruff]
line-length = 120
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["N", "ASYNC", "UP", "B", "TID", "RUF"]
# 문서화된 예외 — select 를 줄이는 것과는 다르다(select 는 그대로 두고, 각 룰이 이 저장소에
# 안 맞는 구체적 이유를 남긴 채 개별적으로 끈다).
#
# UP042: `class X(str, Enum)` → `enum.StrEnum` 제안. Python 3.11+ 에서 `str(member)`/f-string
# 결과가 다르다 — `str, Enum` 믹스인은 "ClassName.MEMBER"(apps/api/CLAUDE.md 의 "plain Text
# 컬럼엔 .value 명시" 규약과 "Postgres ENUM 컬럼엔 .name(대문자) 저장" 규약이 바로 이 차이를
# 전제한다), `StrEnum` 은 순수 값을 준다. 린터 도입 김에 DB 모델 Enum 12개의 직렬화 의미를
# 바꾸는 건 부수효과가 너무 크다 — 하려면 f-string·로깅·json·raw SQL 직렬화 경로를 전수
# 검증하는 별도 작업이어야 한다.
#
# RUF001/002/003: 식별자에 숨은 동형이의 글자(예: 라틴 'a' 대신 키릴 'а') 공격을 잡는 게
# 목적인데, 이 저장소에서 걸린 건 전부 한국어 산문 주석/문자열의 정상 타이포그래피(커브
# 따옴표 ‘’, ×, ℹ)다. 주석이 길고 한국어인 저장소라 앞으로도 계속 새로 걸릴 것이라 꺼둔다.
ignore = ["UP042", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
  "fastapi.Header", "fastapi.Form", "fastapi.File", "fastapi.Security",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi.testclient.TestClient".msg = "httpx.AsyncClient(ASGITransport) 를 쓸 것 — conftest 의 api_client/db_client"
"moto.mock_aws".msg = "ThreadedMotoServer 를 쓸 것 — mock_aws 는 run_in_threadpool 워커에 패치가 안 걸린다"
"sqlalchemy.orm.relationship".msg = "relationship() 금지 — 순수 FK 컬럼만 쓴다"

[tool.mypy]
python_version = "3.11"
# `scripts/` 는 설치되지 않는 CLI 모음이라 여기 없으면 스크립트끼리의 절대 import
# (`from seed_content.ids import ...`)를 mypy 가 못 찾는다 — pytest 의 pythonpath 와 같은 짝.
# `tests/` 도 같은 이유로 필요하다 — 테스트 파일들이 `from factories import ...`로
# 옆 파일(tests/factories.py)을 절대 import 하는데, __init__.py 가 없어 mypy_path 없이는
# 그 디렉터리가 검색 경로에 안 잡힌다.
mypy_path = ["src", "scripts", "tests"]
explicit_package_bases = true
strict = true

[tool.pytest.ini_options]
# `scripts/` 는 src 레이아웃 밖의 CLI 스크립트 모음이라 설치되지 않는다 — 테스트가
# `seed_content` 를 import 하려면 mypy 가 쓰는 것과 같은 패키지 베이스가 필요하다.
pythonpath = ["scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["api"]
# `--cov=src/api` 같은 경로 형태는 `module-not-imported` 경고와 함께 조용히 어긋난다 —
# 패키지 이름이어야 한다.
#
# concurrency: SQLAlchemy 의 asyncio 는 greenlet 위에서 돈다. 이 설정이 없으면 FastAPI
# 라우트 핸들러 본문이 통째로 미커버로 찍힌다 — 2026-09-08 에 이 줄만 빼고 같은 스위트를
# 돌린 A/B 실측(둘 다 870 passed):
#
#     없음: auth/router.py 62% (230문 중 88 미커버) · 전체 83% (843 미커버) · 100% 파일 58개
#     있음: auth/router.py 96% (          9 미커버) · 전체 97% (128 미커버) · 100% 파일 63개
#
# 통과하는 테스트가 분명히 있는데 그 경로가 미커버로 나오면 이 설정부터 의심할 것 —
# test_login_rejects_suspended_account 가 403 을 단언하며 통과하는데도 login() 본문이
# 통째로 미커버로 찍히는 것이 이 함정의 서명이다.
# greenlet 은 sqlalchemy[asyncio] 가 이미 끌어오므로 별도 의존성이 아니다.
concurrency = ["thread", "greenlet"]
