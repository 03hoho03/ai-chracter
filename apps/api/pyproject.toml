[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "03hoho03", email = "122659293+03hoho03@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "boto3>=1.40.0",
    "email-validator>=2.3.0",
    "fastapi>=0.139.0",
    "google-genai>=2.10.0",
    "httpx>=0.27.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.50.2",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.40.0",
    "moto[server]>=5.1.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.mypy]
python_version = "3.11"
# `scripts/` 는 설치되지 않는 CLI 모음이라 여기 없으면 스크립트끼리의 절대 import
# (`from seed_content.ids import ...`)를 mypy 가 못 찾는다 — pytest 의 pythonpath 와 같은 짝.
mypy_path = ["src", "scripts"]
explicit_package_bases = true
strict = true

[tool.pytest.ini_options]
# `scripts/` 는 src 레이아웃 밖의 CLI 스크립트 모음이라 설치되지 않는다 — 테스트가
# `seed_content` 를 import 하려면 mypy 가 쓰는 것과 같은 패키지 베이스가 필요하다.
pythonpath = ["scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
