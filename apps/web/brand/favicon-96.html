<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>또나 favicon-96</title>
    <!--
      apps/web/public/favicon-96.png 의 원본. favicon.svg를 그대로 96x96으로 굽기만 하므로
      두 파비콘의 그림이 어긋날 수 없다. SVG 자체의 원본은 build-favicon-svg.py다.
    -->
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        width: 96px;
        height: 96px;
      }

      img {
        display: block;
        width: 96px;
        height: 96px;
      }
    </style>
  </head>
  <body>
    <img src="/apps/web/public/favicon.svg" alt="또나" />
  </body>
</html>
