# chat-lab 호스팅 서비스 — 별도 compose 프로젝트, 손 배포. 절차·롤백은 같은 폴더의 README.md.
#
#   sudo docker compose -p ddona-lab -f /opt/ddona/lab/docker-compose.lab.yml --env-file /opt/ddona/lab/image.env up -d --wait
#
# VM 은 이 파일의 사본(`/opt/ddona/lab/`)을 쓴다. 저장소 checkout(`/opt/ddona/app`)은 또나 앱 배포가 돌 때만 갱신되어, 이 파일만
# 바뀐 병합은 거기 오지 않는다.
#
# `--env-file` 로 주는 `image.env` 는 아래 `LAB_SERVICE_IMAGE` 를 채우는 보간 전용이라 컨테이너 env 로 가지 않고, 그 파일을 주면
# compose 가 프로젝트 폴더의 `.env` 를 읽지 않는다. 또나 env(`/opt/ddona/.env`)는 이 프로젝트 어디에서도 읽지 않는다. VM 파일의
# 자리·소유·권한은 README 의 「3. 파일 자리(VM)」 표 한 곳에만 적는다.
#
# 포트를 하나도 게시하지 않는다. 바깥에서 들어오는 길은 cloudflared 가 Cloudflare 쪽으로 먼저 연 터널 하나뿐이고, 그 앞에서
# Cloudflare Access 가 사람(Google 로그인)과 업로드 도구(서비스 토큰)를 거른다. 서비스는 Access 가 붙인 JWT 를 다시 검증한다.
name: ddona-lab

# 컨테이너 로그 상한. VM 의 Docker 에 로그 회전 설정이 없어 걸지 않으면 끝없이 쌓인다(`docker-compose.prod.yml` 과 같은 값).
x-logging: &rotated-logs
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  chat-lab-service:
    image: ${LAB_SERVICE_IMAGE:?/opt/ddona/lab/image.env 를 --env-file 로 주어야 한다}
    restart: unless-stopped
    env_file:
      - /opt/ddona/lab.env
    networks:
      # 또나 compose 가 만든 망이다. 같은 Postgres 인스턴스(서비스 이름 `postgres`)의 DB `chat_lab` 에 닿으려고 붙는다.
      - ddona_default
      # cloudflared 와만 나누는 망. Tunnel 공개 호스트 이름의 대상 `chat-lab-service:8000` 을 cloudflared 가 여기서 찾는다.
      - lab_edge
    # 상한이 없으면 메모리가 모자랄 때 OOM killer 가 같은 VM 의 또나 api·postgres 를 고를 수 있다. 한 요청의 정점은 압축 본문
    # (최대 8MiB)·푼 본문(최대 32MiB)·그 파싱 객체다.
    mem_limit: 512m
    logging: *rotated-logs

  cloudflared:
    # 태그가 아니라 digest 로 고정한다 — 태그가 다시 밀려도 바깥 길을 여는 프로세스가 모르는 사이에 바뀌지 않게.
    image: cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    # `--no-autoupdate`: 판은 위 digest 가 정한다. `--metrics 127.0.0.1:20241`: 지표 서버를 컨테이너 자기 루프백에만 열어 같은 망의
    # 서비스 컨테이너가 읽지 못하게 한다.
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      # 토큰 값을 env 나 명령줄로 주면 `docker inspect` 에 그대로 보인다. 파일 자리만 알려 주고 토큰은 읽기 전용 마운트로 넣는다.
      TUNNEL_TOKEN_FILE: /run/lab-tunnel/token
    volumes:
      # 긴 꼴로 적는 것은 호스트 파일이 없을 때 기동을 실패시키려는 것이다. 짧은 꼴(`원본:대상:ro`)은 원본이 없으면 Docker 가 그
      # 자리에 root 소유 빈 폴더를 만들어, 토큰 파일 자리가 폴더로 막힌 채 cloudflared 만 재시작을 되풀이한다.
      - type: bind
        source: /opt/ddona/lab-tunnel-token
        target: /run/lab-tunnel/token
        read_only: true
        bind:
          create_host_path: false
    networks:
      # `ddona_default` 에는 붙이지 않는다. 거기 붙으면 대시보드에서 공개 호스트 이름의 대상 하나를 잘못 적을 때(예: `postgres:5432`)
      # 그 망의 또나 컨테이너로 바깥 길이 열린다 — 이 망에서 컨테이너 이름으로 닿는 대상은 서비스 하나뿐이라 또나 컨테이너 이름으로는
      # 길이 나지 않는다. 다만 일반 브리지라 호스트·인터넷 주소에는 닿으므로, 대상은 IP 가 아니라 서비스 이름으로만 적는다.
      - lab_edge
    mem_limit: 256m
    logging: *rotated-logs
    # 상태 검사(healthcheck)를 두지 않는다. 이미지가 cloudflared 실행 파일만 든 distroless(uid 65532)라 지표 주소를 찔러 볼 셸·
    # HTTP 도구가 없다. 연결 상태는 로그(`Registered tunnel connection`)로 본다.

networks:
  ddona_default:
    external: true
  # 이 compose 가 만드는 일반 브리지다. internal 로 두지 않는다 — cloudflared 가 이 망으로 Cloudflare 에 나가야 한다.
  lab_edge: {}
