# DB 주소는 여기 두지 않는다 — migrations/env.py 가 `LAB_DATABASE_URL` 을 읽어 엔진에 바로 넘긴다. ini 값은 ConfigParser 보간을
# 거쳐, 비밀번호에 `%` 가 있으면 보간 오류 글에 값 전체가 실린다.
[alembic]
script_location = %(here)s/migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
