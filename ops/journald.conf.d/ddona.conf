# journald 디스크 상한. VM 의 /etc/systemd/journald.conf 에는 용량 설정이 없어 기본값(파일시스템의
# 10%, 30GB 디스크면 약 3GB)까지 자랄 수 있고, 실제로 1GB 넘게 쌓였다. 200MB 면 호스트 서비스 로그 며칠치가
# 남는다. 컨테이너 로그는 여기에 들어오지 않는다 — Docker 기본 드라이버(json-file)가 따로 파일로
# 쓰고, caddy·api 의 회전은 docker-compose.prod.yml 의 logging 설정이 맡는다.
#
# 설치·되돌리기 절차는 DEPLOY.md 참고.

[Journal]
SystemMaxUse=200M
