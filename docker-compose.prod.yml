# GCE VM 운영 스택 — Caddy(HTTPS) + API + Postgres 18 + Redis 8.
#
#   docker compose -f docker-compose.prod.yml --env-file /opt/ddona/.env up -d
#
# `docker-compose.dev.yml` 과 목적이 다르다: dev 는 인프라만 띄우고 앱은 호스트에서 돌리지만,
# 여기서는 **앱까지 컨테이너로** 올리고 외부에 열리는 포트는 Caddy 의 80/443 뿐이다.
#
# 필요한 env(전부 `/opt/ddona/.env`):
#   API_IMAGE            배포할 이미지(태그는 커밋 SHA). 롤백은 이 한 줄을 되돌리고 `up -d`.
#   SITE_ADDRESS         `api.ddona.site` (로컬 검증은 `http://localhost`)
#   POSTGRES_PASSWORD    아래 postgres 와 DATABASE_URL 양쪽이 같은 값을 봐야 한다
#   POSTGRES_DB
#   그리고 앱 런타임 env(목록·개수는 DEPLOY.md §2-1 표 참조) — `env_file` 로 api 에 주입된다.
#   ⚠️ 여기에는 개수를 적지 않는다 — 17 → 22 → 23 으로 세 번 어긋났다. 설정이 늘 때 §2-1 한 곳만 고치면 되도록 둔다.
name: ddona

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      # `Caddyfile`의 `/_ingest/*` 라우트가 `{$INGEST_SHARED_SECRET}`를 읽는다(monitoring-techspec.md
      # MT-3). 이 값이 완전히 빠지든 빈 문자열이든 똑같이 Caddyfile 파싱 자체가 실패한다(실측,
      # DEPLOY.md "배포 순서 위험" 참조) — `caddy reload` 경로는 옛 설정을 유지한 채 CI만
      # 실패하지만, 컨테이너가 새로 뜨는 콜드스타트(VM 재구축·이 서비스 재생성)에서는 `caddy run`이
      # 시작 시점에 즉시 종료해 api.ddona.site 전체가 내려간다. 값은 배포 전에 `/opt/ddona/.env`에
      # 먼저 있어야 한다.
      INGEST_SHARED_SECRET: ${INGEST_SHARED_SECRET}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ⚠️ 이 볼륨이 없으면 재시작마다 인증서를 새로 발급받다가 Let's Encrypt 레이트리밋에 걸린다.
      - caddy_data:/data
      - caddy_config:/config
      # 접근 로그 30일 보관(legal-revision-goal-prompt.md LR-13). Caddyfile이 여기로 파일을 쓴다.
      # named volume이 아니라 호스트 bind mount다(LR-29) — roll_keep_for는 이미 회전된 파일만
      # 정리하고 활성 access.log 자체는 시간으로 정리하지 않으므로, 저트래픽 구간에는 호스트
      # logrotate(ops/logrotate.d/ddona-caddy)가 daily 회전을 맡아야 한다. 호스트 도구가 파일을
      # 봐야 하니 named volume 은 못 쓴다. 디렉터리는 DEPLOY.md 절차로 미리 만든다.
      - /opt/ddona/logs/caddy:/var/log/caddy
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    # 포트를 게시하지 않는다 — Caddy 만 이 서비스에 닿는다.
    env_file:
      - ${DDONA_ENV_FILE:-/opt/ddona/.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 이미지에 curl/wget 이 없다(python slim). 파이썬으로 직접 찌른다.
      # `/health` 는 DB·Redis 를 건드리지 않으므로 이 체크는 앱 프로세스 생존만 본다.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    # Neon 이 18.6(실측)이라 18 미만이면 덤프 복원이 거부된다.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # ⚠️ 18+ 는 `/var/lib/postgresql/data` 가 아니라 **버전별 하위 디렉터리**
      # (`/var/lib/postgresql/18/docker`)에 데이터를 둔다. 17 이하의 관례대로 `/data` 에 볼륨을
      # 걸면 이미지가 그걸 "쓰이지 않는 마운트"로 보고 기동을 거부한다(실측). 부모에 걸어야
      # 버전 디렉터리째 볼륨 안에 들어가고, 나중에 pg_upgrade 도 마운트 경계에 걸리지 않는다.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Upstash 가 8.4.0 이고 그게 만든 DUMP 는 redis 7 에서 거부된다(실측) — 백업 스냅샷을
    # 되살릴 여지를 남기려면 8 이어야 한다.
    image: redis:8-alpine
    restart: unless-stopped
    # 세션이 여기 산다. 기본 RDB 스냅샷만으로는 VM 재부팅 때 마지막 몇 분이 날아가
    # 사용자가 로그아웃된다 — AOF 를 켜서 재시작을 넘겨 살아남게 한다.
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
