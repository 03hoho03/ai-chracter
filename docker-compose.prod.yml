# GCE VM 운영 스택 — Caddy(HTTPS) + API(blue/green 두 색) + Postgres 18 + Redis 8.
#
#   docker compose -f docker-compose.prod.yml --env-file /opt/ddona/.env <명령> <서비스…>
#
# ⚠️ 서비스명 없는 `up -d` 는 쓰지 않는다 — 평소 쉬고 있는 색까지 생성·기동해 그 색이 Caddy
# 업스트림에 합류한다. 그래서 교체 스크립트(`ops/swap-api.sh`)는 교체가 끝나면 쉬는 색의 이미지
# 변수도 방금 올린 태그로 맞춘다 — 실수로 떠도 같은 코드가 뜨게 하려는 것이다. 배포·롤백·env 반영
# 재기동은 전부 그 스크립트로 하고, 컨테이너가 하나도 없는 VM 재구축 직후에는 서비스명을 지정해
# `postgres redis` → 마이그레이션 → `api_blue caddy` 순으로 띄운다(DEPLOY.md).
#
# `docker-compose.dev.yml` 과 목적이 다르다: dev 는 인프라만 띄우고 앱은 호스트에서 돌리지만,
# 여기서는 **앱까지 컨테이너로** 올리고 외부에 열리는 포트는 Caddy 의 80/443 뿐이다.
#
# api 는 `api_blue`·`api_green` 두 서비스로 나뉘어 있고 평소에는 한 색만 떠 있다. 교체 배포는 쉬는
# 색을 새 이미지로 띄워 healthy 를 확인한 뒤 옛 색을 드레인하고 내린다 — Caddy 가 두 색을 고정
# 업스트림으로 들고 있어 요청이 끊기지 않는다(Caddyfile 참조).
#
# 필요한 env(전부 `/opt/ddona/.env`):
#   API_IMAGE_BLUE       각 색이 띄울 이미지 전체 참조(태그는 커밋 SHA). 교체 스크립트가 고친다 —
#   API_IMAGE_GREEN      교체가 끝나면 두 줄이 같은 참조를 가리킨다. ⚠️ 둘 중 하나라도 비거나 없으면
#                        compose 가 프로젝트 로드 단계에서 거부해 서비스명을 지정한 명령(`ps` 포함)까지
#                        전부 실패한다(`exec` 만 예외). 앱이 읽는 키가 아니라 `apps/api/.env.example`
#                        에는 넣지 않는다(넣으면 env 파일 검사 CI 가 모르는 키로 실패한다).
#   SITE_ADDRESS         `api.ddona.site` (로컬 검증은 `http://localhost`)
#   POSTGRES_PASSWORD    아래 postgres 와 DATABASE_URL 양쪽이 같은 값을 봐야 한다
#   POSTGRES_DB
#   그리고 앱 런타임 env(목록·개수는 DEPLOY.md "BE 런타임" 절 표 참조) — `env_file` 로 두 색에 주입된다.
#   ⚠️ 여기에는 개수를 적지 않는다 — 17 → 22 → 23 으로 세 번 어긋났다. 설정이 늘 때 그 절 한 곳만 고치면 되도록 둔다.
name: ddona

# 컨테이너 로그 상한. VM 의 Docker 에 로그 회전 설정이 없어 걸지 않으면 무한히 쌓인다 — 특히 caddy 는
# 배포로 재생성되지 않는데, 쉬는 색을 찾지 못한 능동 헬스체크 실패 로그를 매초 남긴다. 20MB×5 면
# caddy 기준 며칠치가 남고, 교체 스크립트가 읽는 `logs --since` 는 수 분 창이라 회전과 무관하다.
# `logging` 은 컨테이너를 만들 때만 걸리므로 postgres·redis 에는 일부러 두지 않는다 — 넣는 순간 다음
# `up` 이 둘을 재생성해 DB 연결과 세션 저장소가 끊긴다(둘의 로그 증가는 미미하다).
x-logging: &rotated-logs
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# 두 색이 공유하는 정의. 서비스마다 다른 것은 `image` 하나뿐이다.
x-api: &api-common
  restart: unless-stopped
  # 포트를 게시하지 않는다 — Caddy 만 이 서비스에 닿는다.
  env_file:
    - ${DDONA_ENV_FILE:-/opt/ddona/.env}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    # 이미지에 curl/wget 이 없다(python slim). 파이썬으로 직접 찌른다.
    # `/health` 는 DB·Redis 를 건드리지 않으므로 이 체크는 앱 프로세스 생존만 본다. 교체 중 옛 색에
    # 드레인 플래그가 서면 503 이 돼 unhealthy 로 바뀌지만, `restart: unless-stopped` 는 unhealthy 를
    # 이유로 재시작하지 않아(실측) 드레인 중인 요청이 끊기지 않는다.
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s
    # 기동 구간(start_period)에만 1초 간격으로 찔러 최초 healthy 판정을 앞당긴다 — 10초
    # 간격이면 앱이 이미 떴어도 다음 체크까지 기다려 교체 배포가 그만큼 길어진다.
    start_interval: 1s
  # 교체 때 옛 색은 드레인 플래그로 Caddy 업스트림에서 먼저 빠진 뒤 멈춘다 — 새 연결은 이미 새 색이
  # 받으므로 이 유예는 하던 요청을 끝까지 보내 주는 시간이고, 길어도 교체가 늦어질 뿐 끊김을 만들지
  # 않는다. 65초는 지금 가장 긴 동기 요청인 발행 자동 심사의 상한(60초)에 여유를 더한 값이다(채팅 SSE
  # 턴은 운영 최대 약 21초). 이보다 긴 요청(예: 상위 모델 채팅 턴)을 열 때는 이 값을 다시 정한다.
  stop_grace_period: 65s
  logging: *rotated-logs

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      # `Caddyfile`의 `/_ingest/*` 라우트가 `{$INGEST_SHARED_SECRET}`를 읽는다.
      # 이 값이 완전히 빠지든 빈 문자열이든 똑같이 Caddyfile 파싱 자체가 실패한다(실측,
      # DEPLOY.md "배포 순서 위험" 참조) — `caddy reload` 경로는 옛 설정을 유지한 채 CI만
      # 실패하지만, 컨테이너가 새로 뜨는 콜드스타트(VM 재구축·이 서비스 재생성)에서는 `caddy run`이
      # 시작 시점에 즉시 종료해 api.ddona.site 전체가 내려간다. 값은 배포 전에 `/opt/ddona/.env`에
      # 먼저 있어야 한다.
      INGEST_SHARED_SECRET: ${INGEST_SHARED_SECRET}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ⚠️ 이 볼륨이 없으면 재시작마다 인증서를 새로 발급받다가 Let's Encrypt 레이트리밋에 걸린다.
      - caddy_data:/data
      - caddy_config:/config
      # 접근 로그 30일 보관. Caddyfile이 여기로 파일을 쓴다.
      # named volume이 아니라 호스트 bind mount다 — roll_keep_for는 이미 회전된 파일만
      # 정리하고 활성 access.log 자체는 시간으로 정리하지 않으므로, 저트래픽 구간에는 호스트
      # logrotate(ops/logrotate.d/ddona-caddy)가 daily 회전을 맡아야 한다. 호스트 도구가 파일을
      # 봐야 하니 named volume 은 못 쓴다. 디렉터리는 DEPLOY.md 절차로 미리 만든다.
      - /opt/ddona/logs/caddy:/var/log/caddy
    # api 색에 depends_on 을 걸지 않는다 — 평소에는 한 색만 떠 있는 것이 정상 형상이라 두 색 모두에
    # `service_healthy` 를 걸면 caddy 가 못 뜬다. 한 색이 없어도 Caddy 는 기동·응답이 정상이다(실측).
    logging: *rotated-logs

  api_blue:
    <<: *api-common
    image: ${API_IMAGE_BLUE}

  api_green:
    <<: *api-common
    image: ${API_IMAGE_GREEN}

  postgres:
    # Neon 이 18.6(실측)이라 18 미만이면 덤프 복원이 거부된다.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # ⚠️ 18+ 는 `/var/lib/postgresql/data` 가 아니라 **버전별 하위 디렉터리**
      # (`/var/lib/postgresql/18/docker`)에 데이터를 둔다. 17 이하의 관례대로 `/data` 에 볼륨을
      # 걸면 이미지가 그걸 "쓰이지 않는 마운트"로 보고 기동을 거부한다(실측). 부모에 걸어야
      # 버전 디렉터리째 볼륨 안에 들어가고, 나중에 pg_upgrade 도 마운트 경계에 걸리지 않는다.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Upstash 가 8.4.0 이고 그게 만든 DUMP 는 redis 7 에서 거부된다(실측) — 백업 스냅샷을
    # 되살릴 여지를 남기려면 8 이어야 한다.
    image: redis:8-alpine
    restart: unless-stopped
    # 세션이 여기 산다. 기본 RDB 스냅샷만으로는 VM 재부팅 때 마지막 몇 분이 날아가
    # 사용자가 로그아웃된다 — AOF 를 켜서 재시작을 넘겨 살아남게 한다.
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
